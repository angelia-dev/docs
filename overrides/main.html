{% extends "base.html" %}

{% block fonts %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
{% endblock %}

{% block extrahead %}
  <meta name="theme-color" content="#1E1B4B">
  <meta property="og:title" content="{{ page.title ~ ' · ' if page.title and not page.is_homepage }}Angelia">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}assets/brand/angelia-avatar-1024.png">
{% endblock %}
